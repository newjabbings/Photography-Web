<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>陈俊亦 Ethan Chen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F3F5; --ink:#30363B; --faint:#8A939A;
  --print:#FDFEFE; --back:#F5F7F8; --shade:rgba(28,40,52,.15);
  --cab:#E2E6E9; --front:#ECEFF1; --front-hi:#F0F2F4; --top:#F6F7F8;
  --tray:#D9DEE2; --wall:#E5E9EC; --handle:#AAB3BA; --leg:#D1D7DB;
  --sw:min(50.6vw,782px); --fh:96px; --side:33.333vw; --head:0px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1E2124; --ink:#D5DADE; --faint:#79828A;
    --print:#E3E6E8; --back:#DCE0E3; --shade:rgba(0,0,0,.5);
    --cab:#2A2E31; --front:#31363A; --front-hi:#363B3F; --top:#383D41;
    --tray:#1A1D20; --wall:#25292C; --handle:#5E676E; --leg:#272B2E;
  }
}
:root[data-theme="dark"]{
  --bg:#1E2124; --ink:#D5DADE; --faint:#79828A;
  --print:#E3E6E8; --back:#DCE0E3; --shade:rgba(0,0,0,.5);
  --cab:#2A2E31; --front:#31363A; --front-hi:#363B3F; --top:#383D41;
  --tray:#1A1D20; --wall:#25292C; --handle:#5E676E; --leg:#272B2E;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:var(--bg);color:var(--ink);
  font-family:"EB Garamond","Noto Serif SC","Songti SC","STSong","Source Han Serif SC",Garamond,serif;
  font-weight:300;-webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:1px solid var(--ink);outline-offset:4px}

/* ---------- side menu (left 1/3) ---------- */
.side{
  position:fixed;z-index:40;top:0;left:0;bottom:0;width:var(--side);
  padding:calc(env(safe-area-inset-top,0px) + 44px) 24px 24px clamp(40px,7vw,112px);
  transition:opacity .5s;
}
.side .name{display:block;font-size:clamp(26px,2.3vw,34px);line-height:1.2;letter-spacing:.01em;text-align:left;font-weight:400}
.side nav{
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  margin-top:clamp(40px,7vh,72px);font-size:clamp(16px,1.25vw,19px);line-height:1.75;
}
.side nav button{position:relative;padding:0;text-align:left}
.side nav button[aria-current="true"]::before{content:"\2022";position:absolute;left:-.95em;top:0}
.side .lang span{color:var(--faint)}
.side .lang span.on{color:var(--ink)}
body.viewing .side{opacity:0;pointer-events:none}

/* ---------- views ---------- */
.view{
  position:fixed;top:var(--head);left:var(--side);right:0;bottom:0;opacity:0;visibility:hidden;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  transition:opacity .7s ease, visibility 0s linear .7s;
}
.view.on{opacity:1;visibility:visible;transition:opacity .7s ease}

/* ---------- nightstand ---------- */
.stand{
  width:var(--sw);margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 110px) 0 calc(env(safe-area-inset-bottom,0px) + 90px);
}
.top{
  position:relative;z-index:3;height:14px;margin:0 -2.5%;
  background:var(--top);border-radius:3px 3px 1px 1px;
  box-shadow:0 1px 0 rgba(0,0,0,.04), 0 8px 12px -10px var(--shade);
}
.body{
  background:var(--cab);padding:10px;display:flex;flex-direction:column;gap:9px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.035);
}
.drawer{position:relative}
.tray{position:relative;height:0;overflow:hidden;margin:0 3%;transition:height 1.5s cubic-bezier(.25,.6,.2,1)}
.tray-inner{
  position:absolute;left:0;right:0;bottom:0;
  background:var(--tray);
  border-left:7px solid var(--wall);border-right:7px solid var(--wall);border-top:9px solid var(--wall);
  box-shadow:inset 0 22px 26px -24px var(--shade), inset 0 0 0 1px rgba(0,0,0,.03);
}
.tray-inner .empty{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:12px;letter-spacing:.08em;color:var(--faint);
}
.front{
  position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  width:100%;height:var(--fh);background:var(--front);border-radius:2px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55), inset 0 -2px 0 rgba(0,0,0,.045), 0 1px 1px rgba(0,0,0,.05);
  transition:transform 1.3s cubic-bezier(.25,.6,.2,1), box-shadow 1.3s, background .3s;
}
.front:hover{background:var(--front-hi)}
.front .handle{
  width:20%;max-width:88px;height:6px;border-radius:3px;background:var(--handle);
  box-shadow:0 2px 3px -1px var(--shade);
}
.front .label{font-size:11px;letter-spacing:.14em;color:var(--faint)}
.front .label:empty{display:none}
.drawer.open .front{
  transform:scale(1.035);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55), inset 0 -2px 0 rgba(0,0,0,.045), 0 16px 24px -16px var(--shade);
}
.legs{display:flex;justify-content:space-between;padding:0 7%}
.legs span{width:10px;height:20px;background:var(--leg)}
.hint{text-align:center;font-size:12px;letter-spacing:.08em;color:var(--faint);margin-top:26px;transition:opacity .6s}

.print{
  position:absolute;background:var(--print);padding:5px;
  box-shadow:0 1px 2px var(--shade), 0 6px 14px -8px var(--shade);
  transform:rotate(var(--r));
  transition:transform .35s ease, box-shadow .35s ease, left .9s cubic-bezier(.2,.7,.2,1), top .9s cubic-bezier(.2,.7,.2,1);
}
.print:hover{transform:rotate(var(--r)) translateY(-3px);box-shadow:0 2px 3px var(--shade), 0 12px 22px -10px var(--shade)}
.print .img{display:block;width:100%;height:100%;background-size:cover;background-position:center}

/* ---------- viewer: square paper ---------- */
.viewer{position:fixed;inset:0;z-index:50;display:none}
.viewer.open{display:block}
.veil{
  position:absolute;inset:0;
  background:color-mix(in srgb, var(--bg) 92%, transparent);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  animation:fade .5s ease both;
}
.viewer.closing .veil{animation:fadeout .45s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
.card{position:absolute;perspective:1800px;display:block}
.inner{
  position:relative;display:block;width:100%;height:100%;
  transform-style:preserve-3d;transition:transform .85s cubic-bezier(.3,.7,.2,1);
}
.card.flipped .inner{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;display:block;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
  box-shadow:0 2px 4px var(--shade), 0 24px 50px -24px var(--shade);
}
.front-face{background:var(--print)}
.front-face .img{
  position:absolute;inset:var(--m,40px);display:block;
  background-size:contain;background-repeat:no-repeat;background-position:center;
}
.back{
  background:var(--back);transform:rotateY(180deg);color:#30363B;
  display:flex;align-items:center;justify-content:center;padding:var(--m,40px);text-align:left;
}
.back .note{font-size:clamp(14px,1.6vw,17px);line-height:2.1;max-width:22em}
.back .empty{font-size:13px;color:#8A939A;letter-spacing:.06em}
.back .date{position:absolute;right:var(--m,40px);bottom:calc(var(--m,40px) * .6);font-size:12px;color:#8A939A}

.controls{
  position:absolute;left:0;right:0;
  bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
  display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;
  animation:fade .6s ease .2s both;
}
.controls .row{display:flex;gap:26px;align-items:baseline}
.controls .row button{padding:6px 4px;color:var(--ink)}
.controls .row button:disabled{opacity:.25;cursor:default}
.count{color:var(--faint);font-variant-numeric:tabular-nums;min-width:4.5em;text-align:center}
.keys{font-size:12px;color:var(--faint);letter-spacing:.04em}
.close{
  position:absolute;right:24px;top:calc(env(safe-area-inset-top,0px) + 18px);
  font-size:13px;padding:4px 0;color:var(--faint);animation:fade .6s ease .2s both;
}
.close:hover{color:var(--ink)}
.viewer.closing .controls,.viewer.closing .close{animation:fadeout .3s ease both}

/* ---------- index ---------- */
#indexView .wrap{
  max-width:1100px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 100px) 24px calc(env(safe-area-inset-bottom,0px) + 80px);
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:28px 24px}
.thumb{display:block;width:100%}
.thumb .frame{
  position:relative;display:block;aspect-ratio:1;background:var(--print);
  box-shadow:0 1px 2px var(--shade);transition:transform .35s, box-shadow .35s;
}
.thumb:hover .frame{transform:translateY(-3px);box-shadow:0 2px 3px var(--shade), 0 12px 22px -12px var(--shade)}
.thumb .img{position:absolute;inset:9%;background-size:contain;background-repeat:no-repeat;background-position:center}

/* ---------- about ---------- */
#aboutView .wrap{
  max-width:30em;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 22vh) 28px calc(env(safe-area-inset-bottom,0px) + 80px);
  font-size:16px;line-height:2.15;
}
#aboutView p{margin:0 0 1.5em}
#aboutView .contact{margin-top:3.5em;font-size:13px;color:var(--faint);line-height:1.9}
#aboutView .contact a{color:inherit;text-underline-offset:3px}

/* ---------- phone ---------- */
@media (max-width:640px){
  :root{--sw:86vw;--fh:72px;--side:0px;--head:calc(env(safe-area-inset-top,0px) + 100px)}
  .side{
    right:0;bottom:auto;width:auto;height:var(--head);background:var(--bg);
    padding:calc(env(safe-area-inset-top,0px) + 20px) 20px 0;
  }
  .side .name{font-size:24px}
  .side nav{flex-direction:row;gap:20px;margin-top:12px;font-size:15px;line-height:1.6;padding-left:.95em}
  .close{right:18px}
  .stand{padding-top:28px}
  #indexView .wrap{padding-top:24px}
  #aboutView .wrap{padding-top:8vh}
  .body{padding:8px;gap:7px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:20px 16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01s !important;animation-duration:.01s !important}
}
</style>
</head>
<body>

<aside class="side">
  <button class="name" id="name" data-i18n="name">陈俊亦</button>
  <nav>
    <button data-go="about" data-i18n="nAbout">关于</button>
    <button data-go="drawer" data-i18n="nDrawer" aria-current="true">抽屉</button>
    <button data-go="index" data-i18n="nIndex">索引</button>
    <button class="lang" id="lang" aria-label="切换语言 / Switch language"><span class="on">中</span> / <span>EN</span></button>
  </nav>
</aside>

<main>
  <section class="view on" id="drawerView" aria-label="抽屉">
    <div class="stand">
      <div class="top"></div>
      <div class="body" id="body"></div>
      <div class="legs"><span></span><span></span></div>
      <p class="hint" id="hint" data-i18n="hint">点一下抽屉</p>
    </div>
  </section>

  <section class="view" id="indexView" aria-label="索引">
    <div class="wrap"><div class="grid" id="grid"></div></div>
  </section>

  <section class="view" id="aboutView" aria-label="关于">
    <div class="wrap" id="about"></div>
  </section>
</main>

<div class="viewer" id="viewer" role="dialog" aria-modal="true">
  <div class="veil" id="veil"></div>
  <button class="card" id="card" data-i18n-label="flipLabel" aria-label="翻面">
    <span class="inner">
      <span class="face front-face"><span class="img" id="frontImg"></span></span>
      <span class="face back" id="back"></span>
    </span>
  </button>
  <button class="close" id="close" data-i18n="close">放回去</button>
  <div class="controls">
    <div class="row">
      <button id="prev" data-i18n="prev">上一张</button>
      <span class="count" id="count"></span>
      <button id="next" data-i18n="next">下一张</button>
    </div>
    <span class="keys" id="keys"></span>
  </div>
</div>

<script>
/* ============================================================
   照片来源：Cloudinary
   每个抽屉对应一个标签。在 Cloudinary 里给照片加上 drawer1 ~ drawer4
   其中一个标签，它就会出现在对应的抽屉里，网站自动更新。
   zh / en 是抽屉面板上的小字（分类名），留空就不显示。
   之前用 drawer 标签的照片，会被放进第一个抽屉。
   背面文字：在照片的 Contextual metadata 里填 note_zh、note_en、date。
   每次打开网站，照片的顺序和位置都会重新随机。
   ============================================================ */
const CONFIG = {
  cloudName:"pnqfdygw",
  drawers:[
    {tag:"drawer1", zh:"", en:""},
    {tag:"drawer2", zh:"", en:""},
    {tag:"drawer3", zh:"", en:""},
    {tag:"drawer4", zh:"", en:""}
  ],
  legacyTag:"drawer"
};

const T = {
  zh:{
    name:"陈俊亦", nDrawer:"抽屉", nIndex:"索引", nAbout:"关于",
    hint:"点一下抽屉", prev:"上一张", next:"下一张",
    close:"放回去", flipLabel:"翻面", empty:"背面还没有写字", emptyDrawer:"这个抽屉还是空的",
    keysDesk:"← → 翻页　　点击照片翻面　　Esc 放回去",
    keysTouch:"左右滑动翻页，点击照片翻面",
    open:"打开抽屉", shut:"关上抽屉",
    about:[
      "我不太擅长把心里的事说出口。很多时候，我只是停下来，拍下一束落在墙上的光，或者某个没有人注意的角落。",
      "这些照片是我替自己记住的东西。它们大多很小，很安静，不属于任何重要的时刻。",
      "它们一直放在抽屉里。现在，我把抽屉拉开一点。"
    ],
    contact:'邮箱：<a href="mailto:ethan.cjy0330@gmail.com">ethan.cjy0330@gmail.com</a>'
  },
  en:{
    name:"Ethan Chen", nDrawer:"Drawers", nIndex:"Index", nAbout:"About",
    hint:"Tap a drawer", prev:"Previous", next:"Next",
    close:"Put it back", flipLabel:"Turn over", empty:"Nothing written on the back yet", emptyDrawer:"This drawer is empty",
    keysDesk:"← → to turn　　Click the photo to flip　　Esc to put back",
    keysTouch:"Swipe to turn, tap the photo to flip",
    open:"Open drawer", shut:"Close drawer",
    about:[
      "I'm not good at saying what I feel. Most of the time, I just stop and take a picture of light resting on a wall, or a corner no one notices.",
      "These photographs are what I keep for myself. Most of them are small and quiet, belonging to no important moment.",
      "They have always been in a drawer. Now, I'm opening it a little."
    ],
    contact:'Email: <a href="mailto:ethan.cjy0330@gmail.com">ethan.cjy0330@gmail.com</a>'
  }
};

/* ---------- placeholders (used only when Cloudinary can't be reached) ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R = mulberry32(11);
const PAL = [["#dfe9ee","#f6f4ee"],["#eee6e3","#fbf9f6"],["#e3ebe6","#f6f8f4"],["#e7e4ef","#f8f7f9"],
             ["#eeecdf","#fdfdf8"],["#dde4ea","#eef1f2"],["#ebdfdc","#f7f2ef"],["#e1e9ea","#fafbfb"]];
const ACC = ["170,190,175","195,175,170","160,180,200","200,190,150","180,175,200","150,165,170"];
const RATIOS = [1.5,1,0.667,1.25,0.8,1,1.5,0.75];
let sampleCount = 0;
const SAMPLES = [
  {zh:"那天的光很软，我站了很久，什么也没想。",en:"The light was soft that day. I stood there a long time, thinking of nothing.",date:"2024.06"},
  {zh:"不记得是哪一年的夏天了，只记得很热。",en:"I don't remember which summer it was. Only that it was hot.",date:"2023.08"}
];
function placeholderBg(){
  const p = PAL[Math.floor(R()*PAL.length)], a = ACC[Math.floor(R()*ACC.length)];
  const x=Math.round(R()*100), y=Math.round(R()*60), x2=Math.round(R()*100), y2=Math.round(40+R()*60);
  return `radial-gradient(circle at ${x}% ${y}%, rgba(255,255,255,.95), rgba(255,255,255,0) ${Math.round(35+R()*30)}%),`+
         `radial-gradient(ellipse at ${x2}% ${y2}%, rgba(${a},.45), rgba(${a},0) ${Math.round(25+R()*20)}%),`+
         `linear-gradient(${Math.round(R()*360)}deg, ${p[0]}, ${p[1]})`;
}
function placeholders(n){
  return Array.from({length:n},()=>{
    const bg = placeholderBg(), s = sampleCount < 2 && R() < .2 ? SAMPLES[sampleCount++] : null;
    return {id:"p"+Math.random(), small:bg, large:bg, ratio:RATIOS[Math.floor(R()*RATIOS.length)],
            note:s?{zh:s.zh,en:s.en}:null, date:s?s.date:""};
  });
}

/* ---------- Cloudinary ---------- */
function cldUrl(r, w){
  return `https://res.cloudinary.com/${CONFIG.cloudName}/image/upload/c_limit,w_${w},f_auto,q_auto/v${r.version}/${r.public_id}.${r.format}`;
}
function toPhoto(r){
  const c = (r.context && (r.context.custom || r.context)) || {};
  const note = (c.note_zh || c.note_en) ? {zh:c.note_zh || c.note_en, en:c.note_en || c.note_zh} : null;
  return {id:r.public_id, small:`url("${cldUrl(r,700)}")`, large:`url("${cldUrl(r,2000)}")`,
          ratio:r.width/r.height, note, date:c.date || ""};
}
async function loadTag(tag){
  try{
    const res = await fetch(`https://res.cloudinary.com/${CONFIG.cloudName}/image/list/${tag}.json`, {cache:"no-store"});
    if(res.status === 404) return [];            // 这个标签还没有照片
    if(!res.ok) throw new Error(res.status);
    const data = await res.json();
    return data.resources.map(toPhoto);
  }catch(err){ console.warn("读取标签失败：", tag, err); return null; }
}
async function loadAll(){
  if(CONFIG.cloudName){
    const tags = CONFIG.drawers.map(d=>d.tag);
    if(CONFIG.legacyTag) tags.push(CONFIG.legacyTag);
    const res = await Promise.all(tags.map(loadTag));
    if(res.some(r=>r)){
      const lists = CONFIG.drawers.map((_,k)=>res[k] || []);
      const legacy = CONFIG.legacyTag ? res[tags.length-1] : null;
      if(legacy){
        const seen = new Set(lists.flat().map(p=>p.id));
        legacy.forEach(p=>{ if(!seen.has(p.id)) lists[0].push(p); });
      }
      return lists;
    }
  }
  return CONFIG.drawers.map(()=>placeholders(14));
}

/* ---------- helpers & state ---------- */
const $ = id => document.getElementById(id);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const rootEl = document.documentElement;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const touchy = matchMedia("(hover: none)").matches;
const isPhone = () => innerWidth <= 640;

let lang = "zh", view = "drawer";
let drawers = [], allPhotos = [];
let seq = [], pos = -1, viewerOpen = false, busy = false, box = null;
let everOpened = false;

/* ---------- build the nightstand ---------- */
function buildDrawers(lists){
  const body = $("body");
  drawers = lists.map((list, d)=>{
    const root = document.createElement("div");
    root.className = "drawer";
    root.innerHTML = `<div class="tray"><div class="tray-inner"></div></div>
      <button class="front" aria-expanded="false"><span class="handle"></span><span class="label"></span></button>`;
    body.appendChild(root);
    const dr = {d, cfg:CONFIG.drawers[d], root, open:false,
                tray:root.querySelector(".tray"), inner:root.querySelector(".tray-inner"),
                front:root.querySelector(".front"), photos:shuffle(list)};
    dr.front.addEventListener("click", ()=>toggleDrawer(d));
    if(!dr.photos.length){
      const e = document.createElement("div");
      e.className = "empty"; dr.inner.appendChild(e);
    }
    dr.photos.forEach(p=>{
      p.d = d;
      p.place = {fx:Math.random(), fy:Math.random(), r:(Math.random()-.5)*20, z:1+Math.floor(Math.random()*40)};
      const b = document.createElement("button");
      b.className = "print";
      b.innerHTML = `<span class="img" style='background-image:${p.small}'></span>`;
      b.addEventListener("click", ()=>openViewer(dr.photos, dr.photos.indexOf(p), b));
      dr.inner.appendChild(b);
      p.el = b;
    });
    return dr;
  });
}
function buildIndex(){
  allPhotos = shuffle(drawers.flatMap(dr=>dr.photos.slice()));
  const grid = $("grid");
  allPhotos.forEach((p,i)=>{
    const b = document.createElement("button");
    b.className = "thumb";
    b.innerHTML = `<span class="frame"><span class="img" style='background-image:${p.small}'></span></span>`;
    b.addEventListener("click", ()=>openViewer(allPhotos, i, b.querySelector(".frame")));
    grid.appendChild(b);
    p.thumb = b.querySelector(".frame");
  });
}

/* ---------- drawers open / close ---------- */
function trayHeight(){
  const sw = document.querySelector(".stand").clientWidth;
  return Math.round(Math.min(sw*(isPhone() ? 1.05 : 0.6), innerHeight*0.62));
}
function layoutTray(dr){
  const H = trayHeight();
  dr.inner.style.height = H+"px";
  const iw = dr.inner.clientWidth, ih = H - 9;
  const base = iw*(isPhone() ? 0.3 : 0.17);
  dr.photos.forEach(p=>positionPrint(p, iw, ih, base));
  return H;
}
function positionPrint(p, iw, ih, base){
  const area = base*base*0.8, w0 = Math.sqrt(area*p.ratio), h0 = w0/p.ratio;
  const w = w0 + 10, h = h0 + 10, q = p.place, el = p.el;
  el.style.width = w+"px"; el.style.height = h+"px";
  el.style.left = (6 + q.fx*Math.max(0, iw-w-12))+"px";
  el.style.top  = (6 + q.fy*Math.max(0, ih-h-12))+"px";
  el.style.setProperty("--r", q.r+"deg");
  el.style.zIndex = q.z;
}
function setOpen(dr, on){
  dr.open = on;
  dr.root.classList.toggle("open", on);
  dr.front.setAttribute("aria-expanded", on);
  dr.front.setAttribute("aria-label", T[lang][on ? "shut" : "open"]);
  if(on){
    const H = layoutTray(dr);
    dr.tray.style.height = H+"px";
    if(!everOpened){ everOpened = true; $("hint").style.opacity = 0; }
    setTimeout(()=>{                         // 让打开的抽屉完整出现在屏幕里
      const v = $("drawerView"), vt = v.getBoundingClientRect().top;
      const r = dr.root.getBoundingClientRect(), fh = dr.front.offsetHeight;
      const top = r.top, bottom = r.top + H + fh;
      if(bottom > innerHeight - 16 || top < vt + 16)
        v.scrollBy({top: top - vt - 28, behavior: reduced ? "auto" : "smooth"});
    }, 60);
  } else {
    dr.tray.style.height = "0px";
  }
}
function toggleDrawer(d){
  drawers.forEach(dr=>{ if(dr.d !== d && dr.open) setOpen(dr, false); });
  setOpen(drawers[d], !drawers[d].open);
}

/* ---------- viewer ---------- */
const viewer = $("viewer"), card = $("card");
function sourceFor(p){ return view === "index" ? p.thumb : p.el; }
function sizeCard(){
  const S = Math.round(Math.min(innerWidth*(isPhone() ? 0.88 : 0.7), innerHeight*(isPhone() ? 0.6 : 0.7), 760));
  const m = Math.round(S*0.075);
  const left = (innerWidth - S)/2, top = (innerHeight - S)/2 - innerHeight*0.035;
  card.style.setProperty("--m", m+"px");
  Object.assign(card.style, {width:S+"px", height:S+"px", left:left+"px", top:top+"px"});
  return {left, top, w:S, h:S};
}
function transformTo(el){
  const r = el.getBoundingClientRect();
  const sx = el.offsetWidth / box.w;
  const dx = (r.left + r.width/2) - (box.left + box.w/2);
  const dy = (r.top + r.height/2) - (box.top + box.h/2);
  const rot = parseFloat(getComputedStyle(el).getPropertyValue("--r")) || 0;
  return `translate(${dx}px,${dy}px) scale(${sx}) rotate(${rot}deg)`;
}
function isVisible(p){
  const el = sourceFor(p);
  if(view === "drawer" && !drawers[p.d].open) return false;
  const r = el.getBoundingClientRect();
  return r.width > 0 && r.bottom > 0 && r.top < innerHeight;
}
function fillCard(){
  const p = seq[pos];
  $("frontImg").style.backgroundImage = p.large;
  const back = $("back");
  back.innerHTML = p.note
    ? `<span class="note"></span>${p.date ? `<span class="date"></span>` : ""}`
    : `<span class="empty"></span>`;
  if(p.note){
    back.querySelector(".note").textContent = p.note[lang];
    if(p.date) back.querySelector(".date").textContent = p.date;
  } else back.querySelector(".empty").textContent = T[lang].empty;
  $("count").textContent = `${pos+1} / ${seq.length}`;
  $("prev").disabled = pos === 0;
  $("next").disabled = pos === seq.length-1;
}
function openViewer(list, i, srcEl){
  seq = list; pos = i; viewerOpen = true; busy = false;
  card.classList.remove("flipped");
  fillCard();
  viewer.classList.remove("closing");
  viewer.classList.add("open");
  document.body.classList.add("viewing");
  box = sizeCard();
  if(!reduced) card.animate([{transform:transformTo(srcEl)},{transform:"none"}],
                            {duration:650, easing:"cubic-bezier(.2,.7,.2,1)"});
  srcEl.style.visibility = "hidden";
  card.focus({preventScroll:true});
}
function goTo(n){
  if(busy || n < 0 || n >= seq.length || n === pos) return;
  const dir = n > pos ? 1 : -1;
  sourceFor(seq[pos]).style.visibility = "";
  pos = n;
  sourceFor(seq[pos]).style.visibility = "hidden";
  const swap = ()=>{ card.classList.remove("flipped"); fillCard(); };
  if(reduced){ swap(); return; }
  busy = true;
  const dist = Math.min(innerWidth*0.45, 460);
  const out = card.animate(
    [{transform:"none", opacity:1}, {transform:`translateX(${-dir*dist}px) rotate(${-dir*1.5}deg)`, opacity:0}],
    {duration:300, easing:"cubic-bezier(.55,0,.8,.4)", fill:"forwards"});
  out.onfinish = ()=>{
    swap();
    const inn = card.animate(
      [{transform:`translateX(${dir*dist}px) rotate(${dir*1.5}deg)`, opacity:0}, {transform:"none", opacity:1}],
      {duration:460, easing:"cubic-bezier(.2,.7,.2,1)"});
    out.cancel();
    inn.onfinish = ()=>{ busy = false; };
  };
}
function closeViewer(){
  if(!viewerOpen) return;
  const p = seq[pos];
  if(view === "drawer" && drawers[p.d].open){          // 放回抽屉，位置会稍微变一点
    const q = p.place;
    q.fx = clamp(q.fx + (Math.random()-.5)*0.1, 0, 1);
    q.fy = clamp(q.fy + (Math.random()-.5)*0.1, 0, 1);
    q.r += (Math.random()-.5)*10;
    q.z = 100 + Math.floor(Math.random()*20);
    layoutTray(drawers[p.d]);
  }
  const src = sourceFor(p);
  const finish = ()=>{
    viewer.classList.remove("open","closing");
    document.body.classList.remove("viewing");
    src.style.visibility = "";
    viewerOpen = false; busy = false;
  };
  viewer.classList.add("closing");
  card.classList.remove("flipped");
  if(reduced){ finish(); return; }
  const anim = isVisible(p)
    ? card.animate([{transform:"none"},{transform:transformTo(src)}],
                   {duration:560, easing:"cubic-bezier(.5,0,.3,1)", fill:"forwards"})
    : card.animate([{opacity:1},{opacity:0}], {duration:400, fill:"forwards"});
  anim.onfinish = ()=>{ finish(); anim.cancel(); };
}

/* flip + swipe */
let sx = null, swiped = false;
card.addEventListener("pointerdown", e=>{ sx = e.clientX; swiped = false; });
card.addEventListener("pointerup", e=>{
  if(sx === null) return;
  const dx = e.clientX - sx; sx = null;
  if(Math.abs(dx) > 50){ swiped = true; goTo(pos + (dx < 0 ? 1 : -1)); }
});
card.addEventListener("click", ()=>{
  if(swiped){ swiped = false; return; }
  card.classList.toggle("flipped");
});
$("veil").addEventListener("click", closeViewer);
$("close").addEventListener("click", closeViewer);
$("prev").addEventListener("click", ()=>goTo(pos-1));
$("next").addEventListener("click", ()=>goTo(pos+1));

addEventListener("keydown", e=>{
  if(viewerOpen){
    if(e.key === "Escape") closeViewer();
    else if(e.key === "ArrowLeft"){ e.preventDefault(); goTo(pos-1); }
    else if(e.key === "ArrowRight"){ e.preventDefault(); goTo(pos+1); }
  } else if(view === "index" && (e.key === "ArrowRight" || e.key === "ArrowLeft") && allPhotos.length){
    const i = e.key === "ArrowRight" ? 0 : allPhotos.length-1;
    openViewer(allPhotos, i, allPhotos[i].thumb);
  }
});

/* ---------- views & language ---------- */
function go(v){
  if(v === view) return;
  if(view === "drawer") drawers.forEach(dr=>{ if(dr.open) setOpen(dr, false); });  // 离开时，抽屉合上
  view = v;
  ["drawer","index","about"].forEach(k=>{
    $(k+"View").classList.toggle("on", k === v);
    document.querySelector(`[data-go="${k}"]`).setAttribute("aria-current", k === v);
  });
}
document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click", ()=>go(b.dataset.go)));
$("name").addEventListener("click", ()=>go("drawer"));

function applyLang(){
  rootEl.lang = lang === "zh" ? "zh" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = T[lang][el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-label]").forEach(el=>{ el.setAttribute("aria-label", T[lang][el.dataset.i18nLabel]); });
  const spans = $("lang").querySelectorAll("span");
  spans[0].classList.toggle("on", lang === "zh");
  spans[1].classList.toggle("on", lang === "en");
  $("keys").textContent = T[lang][touchy ? "keysTouch" : "keysDesk"];
  $("about").innerHTML = T[lang].about.map(()=>`<p></p>`).join("") + `<p class="contact">${T[lang].contact}</p>`;
  $("about").querySelectorAll("p:not(.contact)").forEach((p,k)=>{ p.textContent = T[lang].about[k]; });
  drawers.forEach(dr=>{
    dr.root.querySelector(".label").textContent = dr.cfg[lang] || "";
    dr.front.setAttribute("aria-label", T[lang][dr.open ? "shut" : "open"]);
    const e = dr.inner.querySelector(".empty"); if(e) e.textContent = T[lang].emptyDrawer;
  });
  if(viewerOpen) fillCard();
}
$("lang").addEventListener("click", ()=>{ lang = lang === "zh" ? "en" : "zh"; applyLang(); });

addEventListener("resize", ()=>{
  drawers.forEach(dr=>{ if(dr.open){ const H = layoutTray(dr); dr.tray.style.height = H+"px"; } });
  if(viewerOpen) box = sizeCard();
});

applyLang();
loadAll().then(lists=>{
  buildDrawers(lists);
  buildIndex();
  applyLang();
});
</script>
</body>
</html>
